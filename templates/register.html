{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}

{% if stage == "register" %}
<h3 class="text-center mb-3">Create an Account</h3>

<form method="POST" class="mx-auto" style="max-width: 450px;">

    <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="text" name="number" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Select Role</label>
        <select name="role" class="form-select" required>
            <option value="">Choose</option>
            <option value="admin">Admin</option>
            <option value="owner">Owner</option>
            <option value="user">Tenant</option>
        </select>
    </div>

    <button class="btn btn-primary w-100">Register</button>
</form>

{% endif %}
{% if stage == "verify" %}
<h3 class="text-center mb-3">Verify Your Email</h3>

<form method="POST" class="mx-auto" style="max-width: 350px;">

    <p class="text-center">OTP sent to <b>{{ email }}</b></p>

    <div class="mb-3">
        <label class="form-label">Enter OTP</label>
        <input type="text" name="otp" class="form-control" required>
    </div>

    <button class="btn btn-success w-100 mb-2">Verify OTP</button>

    
    <button name="resend" value="1" class="btn btn-secondary w-100">
        Resend OTP
    </button>

</form>
{% endif %}

{% endblock %}
