{% extends "base.html" %}
{% block title %}Report Issue{% endblock %}

{% block content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    
    .form-container {
        max-width: 700px;
    
        margin: 0 auto;
        padding: 20px 0;
    }

    .complaint-card {
        background: var(--card-bg);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        border: 1px solid rgba(128, 128, 128, 0.1);
        padding: 40px;
        position: relative;
        overflow: hidden;
    }

    /* Decorative Top Border */
    .complaint-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, #ff9966 0%, #ff5e62 100%);
    }

    /* Header Typography */
    .form-header h3 {
        font-weight: 800;
        margin-bottom: 5px;
        color: var(--text-color);
    }

    .form-header p {
        color: var(--text-color);
        opacity: 0.6;
        font-size: 0.95rem;
    }

    /* Property Badge */
    .property-badge {
        background: rgba(128, 128, 128, 0.05);
        border: 1px solid rgba(128, 128, 128, 0.1);
        padding: 10px 15px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
        color: var(--text-color);
    }

    .prop-icon-box {
        width: 40px;
        height: 40px;
        background: rgba(102, 126, 234, 0.1);
        /* Soft Blue */
        color: #667eea;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
    }

    /* Input Styling */
    .custom-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 700;
        color: var(--text-color);
        opacity: 0.7;
        margin-bottom: 8px;
    }

    .form-control {
        background-color: var(--bg-color);
        /* Slightly distinct from card bg */
        border: 1px solid rgba(128, 128, 128, 0.2);
        border-radius: 12px;
        padding: 15px;
        color: var(--text-color);
        transition: all 0.3s ease;
    }

    .form-control:focus {
        background-color: var(--card-bg);
        border-color: #ff9966;
        box-shadow: 0 0 0 4px rgba(255, 153, 102, 0.1);
        color: var(--text-color);
    }

    /* Submit Button */
    .btn-submit-complaint {
        width: 100%;
        background: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-submit-complaint:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(255, 94, 98, 0.3);
        color: white;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: var(--text-color);
        opacity: 0.6;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
    }

    .back-link:hover {
        opacity: 1;
    }
</style>

<div class="container mt-5">

    <div class="form-container">

        <div class="complaint-card">

            <div class="form-header text-center mb-4">
                <h3><i class="fas fa-exclamation-triangle text-warning me-2"></i>Report an Issue</h3>
                <p>We'll notify the owner immediately.</p>
            </div>

            <div class="property-badge">
                <div class="prop-icon-box">
                    <i class="fas fa-home"></i>
                </div>
                <div>
                    <small style="opacity: 0.6; display: block; line-height: 1;">Property</small>
                    <span style="font-weight: 700; font-size: 1.1rem;">{{ property.title }}</span>
                </div>
            </div>

            <form method="POST">

                <div class="mb-4">
                    <label class="custom-label">Subject / Title</label>
                    <input type="text" name="title" required class="form-control"
                        placeholder="e.g., Water leakage in kitchen">
                </div>

                <div class="mb-4">
                    <label class="custom-label">Detailed Description</label>
                    <textarea name="details" rows="5" class="form-control" required
                        placeholder="Describe the issue in detail so we can fix it faster..."></textarea>
                </div>

                <button class="btn-submit-complaint">
                    <i class="fas fa-paper-plane"></i> Submit Complaint
                </button>

            </form>

            <a href="{{ url_for('user_complaints') }}" class="back-link">
                Cancel and go back
            </a>

        </div>

    </div>

</div>

{% endblock %}
