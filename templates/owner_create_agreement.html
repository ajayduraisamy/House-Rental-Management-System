{% extends "base.html" %}
{% block title %}Draft Contract{% endblock %}

{% block content %}

<link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    /* --- TYPOGRAPHY & RESET --- */
    body {
        font-family: 'Poppins', sans-serif !important;
    }

    /* --- PAGE LAYOUT --- */
    .contract-wrapper {
        min-height: 85vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* --- MAIN CARD --- */
    .agreement-card {
        background-color: var(--card-bg);
        width: 100%;
        max-width: 800px;
        border-radius: 12px;
        /* Sharp corners for document feel */
        padding: 50px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        position: relative;
        border: 1px solid rgba(128, 128, 128, 0.1);
        overflow: hidden;
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Gold Accent Top */
    .agreement-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, #DAA520 0%, #FFD700 100%);
        /* Royal Gold */
    }

    /* --- HEADER --- */
    .doc-header {
        text-align: center;
        margin-bottom: 40px;
        border-bottom: 2px solid rgba(128, 128, 128, 0.1);
        padding-bottom: 20px;
    }

    .doc-header h3 {
        font-family: 'Playfair Display', serif;
        /* Legal Font */
        font-size: 2.2rem;
        font-weight: 700;
        color: var(--text-color);
        margin-bottom: 10px;
    }

    .booking-ref {
        font-size: 0.9rem;
        color: var(--text-color);
        opacity: 0.7;
        background: rgba(128, 128, 128, 0.05);
        padding: 5px 15px;
        border-radius: 20px;
        display: inline-block;
    }

    /* --- FORM STYLING (Dark Mode Safe) --- */
    .form-label {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-color);
        opacity: 0.6;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    .input-group-text {
        background-color: var(--bg-color) !important;
        border: 1px solid rgba(128, 128, 128, 0.3) !important;
        border-right: none !important;
        color: #DAA520 !important;
        /* Gold Icon */
        border-radius: 8px 0 0 8px;
        padding: 12px 15px;
    }

    .form-control {
        background-color: var(--bg-color) !important;
        color: var(--text-color) !important;
        border: 1px solid rgba(128, 128, 128, 0.3) !important;
        border-left: none !important;
        border-radius: 0 8px 8px 0;
        padding: 12px 15px;
        transition: all 0.3s;
        font-family: 'Poppins', sans-serif;
    }

    /* Fix Textarea Borders */
    textarea.form-control {
        border-left: 1px solid rgba(128, 128, 128, 0.3) !important;
        border-radius: 8px !important;
    }

    .form-control:focus {
        border-color: #DAA520 !important;
        box-shadow: 0 0 0 3px rgba(218, 165, 32, 0.15) !important;
    }

    .form-control:focus+.input-group-text,
    .input-group:focus-within .input-group-text {
        border-color: #DAA520 !important;
    }

    /* --- UPLOAD ZONE --- */
    .upload-zone {
        border: 2px dashed rgba(128, 128, 128, 0.3);
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        background: var(--bg-color);
        position: relative;
        transition: 0.3s;
    }

    .upload-zone:hover {
        border-color: #DAA520;
        background: rgba(218, 165, 32, 0.05);
    }

    .upload-zone input[type="file"] {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
    }

    .upload-label {
        pointer-events: none;
        color: var(--text-color);
        opacity: 0.7;
    }

    /* --- BUTTON --- */
    .btn-send-contract {
        width: 100%;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        /* Trust Blue */
        color: white;
        border: none;
        padding: 16px;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 8px;
        margin-top: 20px;
        box-shadow: 0 10px 20px rgba(30, 60, 114, 0.3);
        transition: transform 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .btn-send-contract:hover {
        transform: translateY(-3px);
        color: white;
        box-shadow: 0 15px 30px rgba(30, 60, 114, 0.4);
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<div class="contract-wrapper">

    <div class="agreement-card">

        <div class="doc-header">
            <h3><i class="fas fa-file-signature me-2" style="color: #DAA520;"></i>Draft Agreement</h3>
            <div class="booking-ref">
                Booking #{{ booking.id }} &bull; {{ booking.property_title }}
            </div>
        </div>

        <form method="POST" enctype="multipart/form-data">

            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <label class="form-label">Duration</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-calendar-alt"></i></span>
                        <input type="number" name="years" class="form-control" value="1" min="1" required>
                        <span class="input-group-text"
                            style="border-left: none; border-radius: 0 8px 8px 0; font-size: 0.8rem;">Yrs</span>
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Advance Amount</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-rupee-sign"></i></span>
                        <input type="number" name="advance" class="form-control" step="0.01"
                            value="{{ booking.price or 0 }}" required>
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Monthly Rent</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-money-bill-wave"></i></span>
                        <input type="number" name="monthly_rent" class="form-control" step="0.01"
                            value="{{ booking.price or 0 }}" required>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Terms & Conditions</label>
                <textarea name="terms" class="form-control" rows="6"
                    placeholder="Enter standard rental terms here...">Standard rental terms including maintenance, payment due dates, and code of conduct...</textarea>
            </div>

            <div class="mb-4">
                <label class="form-label">Attach Legal Document (PDF)</label>
                <div class="upload-zone">
                    <input type="file" name="agreement_pdf" accept=".pdf">
                    <div class="upload-label">
                        <i class="fas fa-cloud-upload-alt fa-2x mb-2" style="color: #DAA520;"></i><br>
                        <strong>Click to upload</strong> or drag PDF here<br>
                        <small style="opacity: 0.5;">(Optional: Pre-signed document)</small>
                    </div>
                </div>
            </div>

            <button class="btn-send-contract">
                Send for Signature <i class="fas fa-paper-plane"></i>
            </button>

        </form>

    </div>

</div>

{% endblock %}
